<!DOCTYPE html>
<html>
<head>
    <title>Panier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Votre panier</h1>

<a href="/">Retour boutique</a>

{% if cart %}

<ul>
    {% for item in cart %}
    <li>
        {{ item.name }} - {{ item.price }} €

        <a href="/remove/{{ loop.index0 }}">
            <button>Supprimer</button>
        </a>
    </li>
    {% endfor %}
</ul>

<h2>Total : {{ total }} €</h2>

{% else %}

<p>Panier vide</p>

{% endif %}

</body>
</html>
